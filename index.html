<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبارات دورة Power BI</title>
<style>
:root{--yellow:#F7C948;--amber:#E8A317;--cream:#FFF8E3;--cream2:#FFFCF2;--ink:#2B2B2B;--ink2:#5A564C;--line:#EADFC0}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;background:var(--cream2);color:var(--ink);line-height:1.8}
.band{height:12px;background:var(--yellow)}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:26px;margin:0 0 6px;line-height:1.4}
p.sub{color:var(--ink2);margin:0 0 24px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pick a{display:block;text-decoration:none;color:inherit;background:#fff;border:1.5px solid var(--amber);border-radius:16px;padding:24px 16px;text-align:center;font-weight:700;font-size:20px}
.pick a:hover{background:var(--cream)}
.pick small{display:block;font-weight:400;color:var(--ink2);font-size:14px;margin-top:4px}
.note{margin-top:22px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.ftr{margin-top:36px;border-top:1px solid var(--line);padding-top:10px;color:var(--ink2);font-size:14px;text-align:center}
.ftr b{color:var(--ink)}
@media(max-width:520px){.pick{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
  <h1>دورة Power BI «من الأرقام إلى القرار»</h1>
  <p class="sub">اختر الاختبار المطلوب منك اليوم.</p>
  <div class="pick">
    <a href="pre/">الاختبار القبلي<small>أول يوم في الدورة</small></a>
    <a href="post/">الاختبار البعدي<small>آخر يوم في الدورة</small></a>
  </div>
  <div class="note">اكتب اسمك الثلاثي بنفس الطريقة في الاختبارين حتى نقيس تحسّنك، وستظهر لك الدرجة والتصحيح فور التسليم.</div>
  <div class="ftr">المدرب: <b>أحمد حلواني</b></div>
</div>
</body>
</html>
